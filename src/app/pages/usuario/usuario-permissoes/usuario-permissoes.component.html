<div class="mb-25 tagus-card">
  <mat-card>
    <mat-card-header>
      <h5 class="mb-0">Gerenciar Permissões - {{ usuario.nome }}</h5>
    </mat-card-header>
    <mat-card-content>
      <div class="mb-3">
        <h6>Permissões Atuais</h6>
        <div *ngIf="permissoesAtuais.length === 0" class="text-muted">
          Nenhuma permissão atribuída
        </div>
        <div *ngIf="permissoesAtuais.length > 0" class="permissoes-lista">
          <div *ngFor="let permissao of permissoesAtuais" class="permissao-item">
            <span>{{ permissao.nome }}</span>
            <button mat-icon-button color="warn" (click)="removerPermissao(permissao)" title="Remover">
              <mat-icon>delete</mat-icon>
            </button>
          </div>
        </div>
      </div>

      <div class="mt-3">
        <h6>Adicionar Nova Permissão</h6>
        <div class="d-flex align-items-center gap-2">
          <mat-form-field appearance="outline" style="flex: 1;">
            <mat-label>Permissão</mat-label>
            <mat-select [formControl]="permissaoNova">
              <mat-option *ngFor="let permissao of permissoesDisponiveis" [value]="permissao">
                {{ permissao }}
              </mat-option>
            </mat-select>
          </mat-form-field>
          <button mat-raised-button color="primary" (click)="adicionarPermissao()">
            <mat-icon>add</mat-icon>
            Adicionar
          </button>
        </div>
      </div>
    </mat-card-content>
    <mat-card-actions align="end">
      <button mat-button (click)="fechar()">Fechar</button>
    </mat-card-actions>
  </mat-card>
</div>
