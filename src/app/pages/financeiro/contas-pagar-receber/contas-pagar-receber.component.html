<div
    class="mb-25 tagus-card"
    [class.component-dark-theme]="themeService.isDark()"
    [class.card-borderd-theme]="themeService.isCardBorder()"
    [class.card-border-radius]="themeService.isCardBorderRadius()"
    [class.component-rtl-enabled]="themeService.isRTLEnabled()"
>
    <div class="d-table">
        <div class="d-table-cell">
            <div class="tagus-form ms-auto me-auto">
              <div class="row">
                <div class="col-md-6">
                  <mat-card class="single-stats-box tagus-card mb-25">
                    <mat-form-field class="w100 p5">
                      <mat-label>Conta</mat-label>
                      <mat-select matNativeControl [formControl]="contaSelecionadaControl">
                        <mat-option *ngFor="let conta of listaContas" [value]="conta">{{conta.nome}}</mat-option>
                      </mat-select>
                    </mat-form-field>
                    <div class="d-flex justify-content-space-between align-items-center">
                        <div class="title">
                            <h3 *ngIf="this.contaSelecionadaControl.value?.saldoAtual">{{this.contaSelecionadaControl.value?.saldoAtual | currency : 'BRL'}}</h3>
                            <h3 *ngIf="!this.contaSelecionadaControl.value"> - </h3>
                            <span class="d-block gray-color">Saldo Atual</span>
                        </div>
                        <div class="icon">
                            <i class="flaticon-donut-chart"></i>
                        </div>
                    </div>
                  </mat-card>
                </div>
              </div>
              <div class="row">
                <div class="col-md-12">
                  <mat-form-field class="w50 p5">
                    <mat-label>Ano</mat-label>
                    <mat-select matNativeControl [formControl]="anoControl">
                      <mat-option *ngFor="let ano of listaAnos" [value]="ano.id">{{ano.nome}}</mat-option>
                    </mat-select>
                  </mat-form-field>
                  <mat-form-field class="w50 p5">
                    <mat-label>Mes</mat-label>
                    <mat-select matNativeControl [formControl]="mesControl">
                      <mat-option *ngFor="let mes of listaMeses" [value]="mes.id">{{mes.nome}}</mat-option>
                    </mat-select>
                  </mat-form-field>
                </div>
              </div>
              <div class="row">
                <div class="col-md-12">
                  <button mat-flat-button (click)="adicionarLancamento()" class="tagus">Adicionar</button>
                  <button mat-stroked-button (click)="importarCsvHistorico()" class="tagus ms-2" color="warn">
                    Importar CSV (histórico)
                  </button>
                  <button *ngIf="lancamentoSelecionado" mat-flat-button (click)="editarLancamento(lancamentoSelecionado)" class="tagus" style="margin-left: 10px;">Editar Lançamento</button>
                </div>
              </div>
          <app-listagem [lista]="lancamentoList" [columns]="displayedColumnsLancamento" (onclick)="realizarPagamento($event)" [rowClassFunction]="getRowClass" />
        </div>
      </div>
    </div>
</div>
