<div class="mb-25 tagus-card">
    <div class="d-table">
        <div class="d-table-cell">
            <div class="tagus-form ms-auto me-auto">
                <mat-card class="mb-25 tagus-card">
                    <mat-card-header>
                        <h5 class="mb-0">{{ isEdit ? 'Editar Veículo' : 'Cadastrar Veículo' }}</h5>
                    </mat-card-header>
                    <mat-card-content>
                        <form [formGroup]="veiculoForm">
                            <div class="row">
                                <div class="col-md-12">
                                    <mat-form-field class="w-100">
                                        <mat-label>Nome</mat-label>
                                        <input matInput formControlName="nome" placeholder="Ex: Carro 1, Moto 2">
                                        <mat-error *ngIf="veiculoForm.get('nome')?.hasError('required')">
                                            Nome é obrigatório
                                        </mat-error>
                                    </mat-form-field>
                                </div>
                            </div>
                        </form>
                    </mat-card-content>
                    <mat-card-actions align="end">
                        <button mat-button (click)="dialogRef.close()">Cancelar</button>
                        <button mat-raised-button color="primary" (click)="salvar()" [disabled]="veiculoForm.invalid">
                            Salvar
                        </button>
                    </mat-card-actions>
                </mat-card>
            </div>
        </div>
    </div>
</div>
