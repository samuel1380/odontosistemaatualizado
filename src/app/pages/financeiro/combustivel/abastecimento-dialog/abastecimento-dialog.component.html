<div class="mb-25 tagus-card">
    <div class="d-table">
        <div class="d-table-cell">
            <div class="tagus-form ms-auto me-auto">
                <mat-card class="mb-25 tagus-card">
                    <mat-card-header>
                        <h5 class="mb-0">Registrar Abastecimento</h5>
                    </mat-card-header>
                    <mat-card-content>
                        <form [formGroup]="abastecimentoForm">
                            <div class="row">
                                <div class="col-md-6">
                                    <mat-form-field class="w-100">
                                        <mat-label>Veículo</mat-label>
                                        <mat-select formControlName="idVeiculo">
                                            <mat-option *ngFor="let veiculo of veiculos" [value]="veiculo.idVeiculo">
                                                {{ veiculo.nome }}
                                            </mat-option>
                                        </mat-select>
                                    </mat-form-field>
                                </div>
                                <div class="col-md-6">
                                    <mat-form-field class="w-100">
                                        <mat-label>Data do Abastecimento</mat-label>
                                        <input matInput [matDatepicker]="picker" formControlName="dataAbastecimento">
                                        <mat-datepicker-toggle matIconSuffix [for]="picker"></mat-datepicker-toggle>
                                        <mat-datepicker #picker></mat-datepicker>
                                    </mat-form-field>
                                </div>
                            </div>

                            <div class="row">
                                <div class="col-md-4">
                                    <mat-form-field class="w-100">
                                        <mat-label>Litros</mat-label>
                                        <input type="number" matInput formControlName="litros" step="0.01" min="0.01">
                                    </mat-form-field>
                                </div>
                                <div class="col-md-4">
                                    <mat-form-field class="w-100">
                                        <mat-label>Valor por Litro</mat-label>
                                        <span matTextPrefix>R$&nbsp;</span>
                                        <input type="number" matInput formControlName="valorLitro" step="0.01" min="0.01">
                                    </mat-form-field>
                                </div>
                                <div class="col-md-4">
                                    <mat-form-field class="w-100">
                                        <mat-label>Valor Total</mat-label>
                                        <span matTextPrefix>R$&nbsp;</span>
                                        <input type="number" matInput [value]="valorTotal" disabled>
                                    </mat-form-field>
                                </div>
                            </div>

                            <div class="row">
                                <div class="col-md-6">
                                    <mat-form-field class="w-100">
                                        <mat-label>Quilometragem</mat-label>
                                        <input type="number" matInput formControlName="quilometragem">
                                    </mat-form-field>
                                </div>
                                <div class="col-md-6">
                                    <mat-form-field class="w-100">
                                        <mat-label>Local</mat-label>
                                        <input matInput formControlName="local" placeholder="Ex: Posto Shell">
                                    </mat-form-field>
                                </div>
                            </div>



                            <div class="row">
                                <div class="col-md-12">
                                    <mat-form-field class="w-100">
                                        <mat-label>Observações</mat-label>
                                        <textarea matInput formControlName="observacoes" rows="3"></textarea>
                                    </mat-form-field>
                                </div>
                            </div>
                        </form>
                    </mat-card-content>
                    <mat-card-actions align="end">
                        <button mat-button (click)="dialogRef.close()">Cancelar</button>
                        <button mat-raised-button color="primary" (click)="salvar()" [disabled]="abastecimentoForm.invalid">
                            Salvar
                        </button>
                    </mat-card-actions>
                </mat-card>
            </div>
        </div>
    </div>
</div>
