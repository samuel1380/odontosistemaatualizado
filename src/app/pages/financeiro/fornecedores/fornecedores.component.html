<div
  class="mb-25 tagus-card"
  [class.component-dark-theme]="themeService.isDark()"
  [class.card-borderd-theme]="themeService.isCardBorder()"
  [class.card-border-radius]="themeService.isCardBorderRadius()"
>
  <div class="d-table">
    <div class="d-table-cell">
      <div class="tagus-form ms-auto me-auto">
        <mat-card class="mb-25 tagus-card">
          <mat-card-header>
            <h5 class="mb-0">Fornecedores (Contas a Pagar)</h5>
          </mat-card-header>
          <mat-card-content>
            <div class="row mb-3">
              <div class="col-md-12">
                <button mat-flat-button (click)="adicionar()" class="tagus">Novo Fornecedor</button>
              </div>
            </div>
            <p *ngIf="carregando">Carregando...</p>
            <app-listagem
              *ngIf="!carregando"
              [lista]="listaFornecedores"
              [columns]="displayedColumns"
              (onclick)="editar($event)"
            />
          </mat-card-content>
        </mat-card>
      </div>
    </div>
  </div>
</div>
