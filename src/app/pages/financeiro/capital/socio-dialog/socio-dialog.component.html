<div class="mb-25 tagus-card">
    <div class="d-table">
        <div class="d-table-cell">
            <div class="tagus-form ms-auto me-auto">
                <mat-card class="mb-25 tagus-card">
                    <mat-card-header>
                        <h5 class="mb-0">{{ isEdit ? 'Editar Sócio' : 'Cadastrar Sócio' }}</h5>
                    </mat-card-header>
                    <mat-card-content>
                        <form [formGroup]="socioForm">
                            <div class="row">
                                <div class="col-md-12">
                                    <mat-form-field class="w-100">
                                        <mat-label>Nome *</mat-label>
                                        <input matInput formControlName="nome" placeholder="Nome do sócio">
                                        <mat-error *ngIf="socioForm.get('nome')?.hasError('required')">
                                            Nome é obrigatório
                                        </mat-error>
                                    </mat-form-field>
                                </div>
                            </div>

                            <div class="row">
                                <div class="col-md-6">
                                    <mat-form-field class="w-100">
                                        <mat-label>CPF</mat-label>
                                        <input matInput formControlName="cpf" placeholder="000.000.000-00">
                                    </mat-form-field>
                                </div>
                                <div class="col-md-6">
                                    <mat-form-field class="w-100">
                                        <mat-label>CNPJ</mat-label>
                                        <input matInput formControlName="cnpj" placeholder="00.000.000/0000-00">
                                    </mat-form-field>
                                </div>
                            </div>

                            <div class="row">
                                <div class="col-md-6">
                                    <mat-form-field class="w-100">
                                        <mat-label>Telefone</mat-label>
                                        <input matInput formControlName="telefone" placeholder="(00) 00000-0000">
                                    </mat-form-field>
                                </div>
                                <div class="col-md-6">
                                    <mat-form-field class="w-100">
                                        <mat-label>Email</mat-label>
                                        <input type="email" matInput formControlName="email" placeholder="email@exemplo.com">
                                    </mat-form-field>
                                </div>
                            </div>

                            <div class="row">
                                <div class="col-md-12">
                                    <mat-form-field class="w-100">
                                        <mat-label>Endereço</mat-label>
                                        <textarea matInput formControlName="endereco" rows="2" placeholder="Endereço completo"></textarea>
                                    </mat-form-field>
                                </div>
                            </div>

                            <div class="row">
                                <div class="col-md-12">
                                    <mat-form-field class="w-100">
                                        <mat-label>Empresa</mat-label>
                                        <mat-select formControlName="idEmpresa">
                                            <mat-option [value]="null">Nenhuma</mat-option>
                                            <mat-option *ngFor="let empresa of empresas" [value]="empresa.idEmpresa">
                                                {{ empresa.nome }}
                                            </mat-option>
                                        </mat-select>
                                    </mat-form-field>
                                </div>
                            </div>
                        </form>
                    </mat-card-content>
                    <mat-card-actions align="end">
                        <button mat-button (click)="dialogRef.close()">Cancelar</button>
                        <button mat-raised-button color="primary" (click)="salvar()" [disabled]="socioForm.invalid">
                            Salvar
                        </button>
                    </mat-card-actions>
                </mat-card>
            </div>
        </div>
    </div>
</div>
