<div
  class="mb-25 tagus-card"
  [class.component-dark-theme]="themeService.isDark()"
  [class.card-borderd-theme]="themeService.isCardBorder()"
  [class.card-border-radius]="themeService.isCardBorderRadius()"
  [class.component-rtl-enabled]="themeService.isRTLEnabled()"
>
  <div class="d-table">
    <div class="d-table-cell">
      <div class="tagus-form ms-auto me-auto">
        <div class="row">
          <div class="col-md-12">
            <mat-form-field class="w50 p5">
              <mat-label>Ano</mat-label>
              <mat-select [formControl]="anoControl">
                <mat-option *ngFor="let ano of listaAnos" [value]="ano.id">{{ ano.nome }}</mat-option>
              </mat-select>
            </mat-form-field>
            <mat-form-field class="w50 p5">
              <mat-label>Mês</mat-label>
              <mat-select [formControl]="mesControl">
                <mat-option *ngFor="let mes of listaMeses" [value]="mes.id">{{ mes.nome }}</mat-option>
              </mat-select>
            </mat-form-field>
          </div>
        </div>
        <div class="row">
          <div class="col-md-12">
            <mat-form-field class="w33 p5">
              <mat-label>Status</mat-label>
              <mat-select [formControl]="statusControl">
                <mat-option *ngFor="let s of statusOptions" [value]="s.id">{{ s.nome }}</mat-option>
              </mat-select>
            </mat-form-field>
            <mat-form-field class="w33 p5">
              <mat-label>Categoria</mat-label>
              <mat-select [formControl]="categoriaPaiControl">
                <mat-option [value]="null">Todas</mat-option>
                <mat-option *ngFor="let c of categoriasPai" [value]="c.idCategoria">{{ c.nome }}</mat-option>
              </mat-select>
            </mat-form-field>
            <mat-form-field class="w33 p5">
              <mat-label>Subcategoria</mat-label>
              <mat-select [formControl]="subcategoriaControl" [disabled]="!categoriaPaiControl.value">
                <mat-option [value]="null">Todas</mat-option>
                <mat-option *ngFor="let s of subcategorias" [value]="s.idCategoria">{{ s.nome }}</mat-option>
              </mat-select>
            </mat-form-field>
          </div>
        </div>
        <div class="row">
          <div class="col-md-12">
            <button mat-flat-button (click)="adicionarLancamento()" class="tagus">Adicionar</button>
            <button mat-stroked-button (click)="importarCsvHistorico()" class="tagus ms-2" color="warn">Importar CSV (histórico)</button>
            <button *ngIf="lancamentoSelecionado" mat-flat-button (click)="editarLancamento(lancamentoSelecionado)" class="tagus" style="margin-left: 10px;">Editar Lançamento</button>
          </div>
        </div>
        <div class="row">
          <div class="col-md-12">
            <div style="padding: 6px 6px 12px 6px; font-weight: 600;">
              Total: {{ totalSomatoria | currency:'BRL':'symbol':'1.2-2':'pt-BR' }}
            </div>
          </div>
        </div>
        <app-listagem
          [lista]="lancamentoList"
          [columns]="displayedColumnsLancamento"
          (onclick)="realizarPagamento($event)"
          [rowClassFunction]="getRowClass"
        />
      </div>
    </div>
  </div>
</div>
