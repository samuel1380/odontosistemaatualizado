<div class="mb-25 tagus-card">
    <div class="d-table">
        <div class="d-table-cell">
            <div class="tagus-form ms-auto me-auto">
                <mat-card class="mb-25 tagus-card">
                    <mat-card-header>
                        <h5 class="mb-0">Quitar Boleto Atrasado</h5>
                    </mat-card-header>
                    <mat-card-content>
                        <form [formGroup]="quitarForm">
                            <div class="row">
                                <div class="col-md-12">
                                    <mat-form-field class="w-100">
                                        <mat-label>Descrição</mat-label>
                                        <input matInput formControlName="descricao">
                                    </mat-form-field>
                                </div>
                            </div>

                            <div class="row">
                                <div class="col-md-6">
                                    <mat-form-field class="w-100">
                                        <mat-label>Data de Vencimento</mat-label>
                                        <input matInput formControlName="dataVencimento">
                                    </mat-form-field>
                                </div>
                                <div class="col-md-6">
                                    <mat-form-field class="w-100">
                                        <mat-label>Valor Restante</mat-label>
                                        <span matTextPrefix>R$&nbsp;</span>
                                        <input type="number" matInput formControlName="valorRestante">
                                    </mat-form-field>
                                </div>
                            </div>

                            <div class="row">
                                <div class="col-md-12 mb-3">
                                    <mat-checkbox formControlName="gerarJuros">
                                        Aplicar juros e multa
                                    </mat-checkbox>
                                </div>
                            </div>

                            <div class="row">
                                <div class="col-md-4">
                                    <mat-form-field class="w-100">
                                        <mat-label>Juros</mat-label>
                                        <span matTextPrefix>R$&nbsp;</span>
                                        <input type="number" matInput formControlName="juros">
                                    </mat-form-field>
                                </div>
                                <div class="col-md-4">
                                    <mat-form-field class="w-100">
                                        <mat-label>Multa</mat-label>
                                        <span matTextPrefix>R$&nbsp;</span>
                                        <input type="number" matInput formControlName="multa">
                                    </mat-form-field>
                                </div>
                                <div class="col-md-4">
                                    <mat-form-field class="w-100">
                                        <mat-label>Total com Juros</mat-label>
                                        <span matTextPrefix>R$&nbsp;</span>
                                        <input type="number" matInput formControlName="valorTotalComJuros">
                                    </mat-form-field>
                                </div>
                            </div>

                            <div class="row">
                                <div class="col-md-6">
                                    <mat-form-field class="w-100">
                                        <mat-label>Meio de Pagamento</mat-label>
                                        <mat-select formControlName="meioPagamento">
                                            <mat-option *ngFor="let meio of meiosPagamento" [value]="meio.id">
                                                {{meio.nome}}
                                            </mat-option>
                                        </mat-select>
                                    </mat-form-field>
                                </div>
                                <div class="col-md-6">
                                    <mat-form-field class="w-100">
                                        <mat-label>Conta</mat-label>
                                        <mat-select formControlName="idConta">
                                            <mat-option *ngFor="let conta of listaContas" [value]="conta.idConta">
                                                {{conta.nome}}
                                            </mat-option>
                                        </mat-select>
                                    </mat-form-field>
                                </div>
                            </div>

                            <div class="row">
                                <div class="col-md-6">
                                    <mat-form-field class="w-100">
                                        <mat-label>Data do Pagamento</mat-label>
                                        <input matInput [matDatepicker]="pickerPagamento" formControlName="dataPagamento">
                                        <mat-datepicker-toggle matIconSuffix [for]="pickerPagamento"></mat-datepicker-toggle>
                                        <mat-datepicker #pickerPagamento></mat-datepicker>
                                    </mat-form-field>
                                </div>
                            </div>
                        </form>
                    </mat-card-content>
                    <mat-card-actions align="end">
                        <button mat-button (click)="dialogRef.close()">Cancelar</button>
                        <button mat-raised-button color="primary" (click)="confirmarQuitacao()" [disabled]="quitarForm.invalid">
                            Confirmar Quitação
                        </button>
                    </mat-card-actions>
                </mat-card>
            </div>
        </div>
    </div>
</div>
