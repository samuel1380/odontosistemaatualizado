<div
    class="mb-25 tagus-card"
    [class.component-dark-theme]="themeService.isDark()"
    [class.card-borderd-theme]="themeService.isCardBorder()"
    [class.card-border-radius]="themeService.isCardBorderRadius()"
    [class.component-rtl-enabled]="themeService.isRTLEnabled()"
>
    <div class="d-table">
        <div class="d-table-cell">
            <div class="tagus-form ms-auto me-auto">
                  <mat-card class="mb-25 tagus-card">
                    <mat-card-header>
                        <h5 class="mb-0">Cadastrar</h5>
                    </mat-card-header>
                    <mat-card-content>
                        <form>
                          <mat-form-field class="w100 p5">
                            <mat-label>Nome tabela de preço produto</mat-label>
                            <input type="text" matInput [formControl]="nomeFormControl">
                            <mat-error *ngIf="nomeFormControl.hasError('nomePacienteFormControl') && !nomeFormControl.hasError('required')">
                              Por favor preencha o nome da tabela de preço produto
                            </mat-error>
                            <mat-error *ngIf="nomeFormControl.hasError('required')">
                              Nome da tabela é <strong>requerido</strong>
                            </mat-error>
                          </mat-form-field>

                          <div *ngIf="tabelaPrecoProduto?.idTabelaPrecoProdutoOrigem" class="row">
                            <div class="col-md-12">
                              <mat-form-field class="w100 p5">
                                <mat-label>Número da Versão</mat-label>
                                <input type="text" matInput [formControl]="numeroVersaoFormControl" placeholder="Ex: 01, 02, 2025">
                                <mat-error *ngIf="numeroVersaoFormControl.hasError('required')">
                                  Número da versão é <strong>obrigatório</strong>
                                </mat-error>
                              </mat-form-field>
                            </div>
                          </div>

                        </form>

                        <mat-divider></mat-divider>

                        <form [formGroup]="dynamicFormProdutos">
                          <div formArrayName="items">
                            <div *ngFor="let item of items.controls; let i=index" [formGroupName]="i">

                              <mat-form-field class="w50 p5">
                                <mat-label>Nome produto</mat-label>
                                <input matInput formControlName="nome">
                              </mat-form-field>

                              <mat-form-field class="w50 p5">
                                <mat-label>Preço</mat-label>
                                <span matTextPrefix>R$&nbsp;</span>
                                <input type="number" matInput formControlName="preco">
                              </mat-form-field>

                            </div>
                          </div>
                        </form>
                    </mat-card-content>
                    <button mat-flat-button class="tagus fw-semibold" color="warn"  [routerLink]="'/l/marca'">Cancelar</button>
                    <button mat-flat-button class="tagus fw-semibold" (click)="onSubmitButton($event)">Salvar</button>
                </mat-card>
            </div>
        </div>
    </div>
</div>
