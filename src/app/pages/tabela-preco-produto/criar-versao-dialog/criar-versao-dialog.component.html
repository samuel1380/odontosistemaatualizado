<h1 mat-dialog-title>Criar Nova Versão - {{ data.nomeTabela }}</h1>
<div mat-dialog-content>
    <form [formGroup]="versaoForm">
        <div class="row">
            <div class="col-md-12">
                <mat-form-field class="w-100">
                    <mat-label>Número da Versão</mat-label>
                    <input matInput formControlName="numeroVersao" placeholder="Ex: 01, 02, 2025, etc.">
                    <mat-error *ngIf="versaoForm.get('numeroVersao')?.hasError('required')">
                        Número da versão é <strong>obrigatório</strong>
                    </mat-error>
                </mat-form-field>
            </div>
        </div>

    </form>
</div>
<div mat-dialog-actions align="end">
    <button mat-button (click)="cancelar()" [disabled]="carregando">Cancelar</button>
    <button 
        mat-raised-button 
        color="primary" 
        (click)="criarVersao()" 
        [disabled]="versaoForm.invalid || carregando">
        <span *ngIf="carregando">Criando...</span>
        <span *ngIf="!carregando">Criar Versão</span>
    </button>
</div>
