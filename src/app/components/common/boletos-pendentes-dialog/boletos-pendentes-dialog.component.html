<h2 mat-dialog-title>Pendências Financeiras</h2>
<mat-dialog-content>
  <p>O cliente <strong>{{ data.nomeEmpresa }}</strong> possui as seguintes pendências:</p>
  
  <div *ngIf="carregando" class="text-center p-3">
    <mat-spinner diameter="30"></mat-spinner>
  </div>

  <table mat-table [dataSource]="boletos" class="mat-elevation-z2" *ngIf="!carregando && boletos.length > 0">
    <ng-container matColumnDef="descricao">
      <th mat-header-cell *matHeaderCellDef> Descrição </th>
      <td mat-cell *matCellDef="let element"> {{element.descricao}} </td>
    </ng-container>

    <ng-container matColumnDef="dataVencimento">
      <th mat-header-cell *matHeaderCellDef> Vencimento </th>
      <td mat-cell *matCellDef="let element"> {{element.dataVencimento | date:'dd/MM/yyyy'}} </td>
    </ng-container>

    <ng-container matColumnDef="diasAtraso">
      <th mat-header-cell *matHeaderCellDef> Atraso </th>
      <td mat-cell *matCellDef="let element"> <span class="badge bg-danger">{{element.diasAtraso}} dias</span> </td>
    </ng-container>

    <ng-container matColumnDef="valor">
      <th mat-header-cell *matHeaderCellDef> Valor </th>
      <td mat-cell *matCellDef="let element"> {{element.valorRestante | currency:'BRL'}} </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
  </table>

  <div *ngIf="!carregando && boletos.length === 0" class="alert alert-success">
    Nenhuma pendência encontrada.
  </div>
</mat-dialog-content>
<mat-dialog-actions align="end">
  <button mat-button (click)="fechar()">Fechar</button>
</mat-dialog-actions>
